services:
  postgres:
    image: postgres:15-alpine
    container_name: votapp-postgres
    environment:
      POSTGRES_USER: votapp_user
      POSTGRES_PASSWORD: votapp_password
      POSTGRES_DB: sistema_votaciones_institucional
    ports:
      - "5432:5432"
    networks:
      - votapp-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U votapp_user -d sistema_votaciones_institucional"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: votapp-redis
    ports:
      - "6379:6379"
    networks:
      - votapp-network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  votapp-network:
    driver: bridge
    name: votapp-network

volumes:
  postgres_data:
  redis_data:
