spring:
  application:
    name: Electoral-Votapp

  security:
    user:
      name: admin
      password: ${ADMIN_PASSWORD:admin}
      roles: ADMIN

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sistema_votaciones_institucional}
    username: ${SPRING_DATASOURCE_USERNAME:votapp_user}
    password: ${SPRING_DATASOURCE_PASSWORD:votapp_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: false

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:}

server:
  port: ${SERVER_PORT:8080}

# SpringDoc v3.x disables both endpoints by default — must be explicitly enabled
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

app:
  report:
    watermark-text: ${REPORT_WATERMARK_TEXT:Votapp - Sistema Electoral}

  file-upload:
    upload-dir: ${FILE_UPLOAD_DIR:${java.io.tmpdir}/votapp-uploads}
    max-size-bytes: ${FILE_UPLOAD_MAX_SIZE:5242880}
    allowed-types: ${FILE_UPLOAD_ALLOWED_TYPES:image/jpeg,image/png,image/webp}
